name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reviewpulse
          POSTGRES_PASSWORD: reviewpulse # pragma: allowlist secret
          POSTGRES_DB: reviewpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reviewpulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://reviewpulse:reviewpulse@localhost:5432/reviewpulse # pragma: allowlist secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy --config-file pyproject.toml api

      - name: Apply migrations to an empty database
        run: alembic upgrade head

      - name: Tests with coverage
        run: pytest --cov=app --cov-fail-under=80
