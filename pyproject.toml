[tool.pytest.ini_options]
pythonpath = ["api"]
testpaths = ["api/tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["api/migrations/versions"]
target-version = "py311"
src = ["api"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "api"
