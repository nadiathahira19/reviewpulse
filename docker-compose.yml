services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: reviewpulse
      POSTGRES_PASSWORD: reviewpulse # pragma: allowlist secret
      POSTGRES_DB: reviewpulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewpulse -d reviewpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      args:
        INSTALL_ML: "false"
    # SimpleWorker runs jobs in the same process, so the model is loaded only once.
    # --with-scheduler is needed so the waiting time between retries works.
    command:
      [
        "rq", "worker", "reviews",
        "--url", "redis://redis:6379/0",
        "--worker-class", "rq.SimpleWorker",
        "--with-scheduler",
      ]
    environment:
      DATABASE_URL: postgresql+psycopg://reviewpulse:reviewpulse@db:5432/reviewpulse # pragma: allowlist secret
      REDIS_URL: redis://redis:6379/0
      MODEL_NAME: ${MODEL_NAME:-}
      HF_HOME: /home/appuser/.cache/huggingface
    volumes:
      - hfcache:/home/appuser/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  hfcache:
